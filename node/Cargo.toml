[package]
name = "rdict-js"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
rdict = { path = "../core" }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[workspace]
