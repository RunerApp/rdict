[package]
name = "rdict"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"
description = "Read and write Rdict dictionary distribution packs"
repository = "https://github.com/RunerApp/rdict"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
sha1 = "0.10"
zstd = "0.13"
zip = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
