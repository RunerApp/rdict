name: RdictApp
options:
  bundleIdPrefix: com.rdict
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
targets:
  RdictApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/RdictApp
      - path: ../../compiler/dictionaries/eng-zho-ngsl.rdict
        buildPhase: resources
    dependencies:
      - package: Rdict
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rdict.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Rdict"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
  RdictAppMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/RdictApp
      - path: ../../compiler/dictionaries/eng-zho-ngsl.rdict
        buildPhase: resources
    dependencies:
      - package: Rdict
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rdict.app.mac
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Rdict"
        INFOPLIST_KEY_NSMainNibFile: ""
        INFOPLIST_KEY_NSPrincipalClass: "NSApplication"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      - script: |
          # Select the correct librdict.a based on the target SDK.
          LIBDIR="${PROJECT_DIR}/../../swift/lib"
          case "$PLATFORM_NAME" in
            iphoneos)
              SRC="${PROJECT_DIR}/../../core/target/aarch64-apple-ios/release/librdict.a"
              ;;
            iphonesimulator)
              SRC="${PROJECT_DIR}/../../core/target/aarch64-apple-ios-sim/release/librdict.a"
              ;;
            macosx)
              SRC="${PROJECT_DIR}/../../core/target/release/librdict.a"
              ;;
            *)
              echo "Unknown platform: $PLATFORM_NAME"
              exit 1
              ;;
          esac
          if [ ! -f "$SRC" ]; then
            echo "Building Rust for $PLATFORM_NAME..."
            case "$PLATFORM_NAME" in
              iphoneos)
                cargo build --manifest-path "${PROJECT_DIR}/../../core/Cargo.toml" --release --target aarch64-apple-ios
                ;;
              iphonesimulator)
                cargo build --manifest-path "${PROJECT_DIR}/../../core/Cargo.toml" --release --target aarch64-apple-ios-sim
                ;;
              macosx)
                cargo build --manifest-path "${PROJECT_DIR}/../../core/Cargo.toml" --release
                ;;
            esac
          fi
          cp "$SRC" "$LIBDIR/librdict.a"
          echo "Copied $SRC -> $LIBDIR/librdict.a"
        name: Select librdict.a by platform
        outputFiles:
          - $(PROJECT_DIR)/../../swift/lib/librdict.a
packages:
  Rdict:
    path: ../../swift
