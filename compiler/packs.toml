# rdict pack registry — single source of truth for per-language pack
# metadata, shared by db_to_rdict.rs (compiler) and covers/make_covers.py.
#
# Adding a new language: add one [languages.X] block + one
# [[packs]] entry per pack you ship. No code changes needed.

[languages.en]
name = "English"
default_targets = ["zh-Hans", "es-ES"]

[languages.es]
name = "Spanish"
default_targets = ["zh-Hans", "en"]

[languages.ja]
name = "Japanese"
default_targets = ["zh-Hans", "en"]

[languages.fr]
name = "French"
default_targets = ["zh-Hans", "en"]

[languages.ko]
name = "Korean"
default_targets = ["zh-Hans", "en"]

[languages.de]
name = "German"
default_targets = ["zh-Hans", "en"]

[languages.pt]
name = "Portuguese"
default_targets = ["zh-Hans", "en"]

[languages.it]
name = "Italian"
default_targets = ["zh-Hans", "en"]

# ── packs ────────────────────────────────────────────────────────────
# targets = [] means monolingual. key = "<src>|<sorted targets>" as the
# compiler matches on (same as the old Rust match arms).

[[packs]]
combo = "en|"
id = "en-en"
name = "English Dictionary (Monolingual)"
description = "Monolingual English learner's dictionary"

[[packs]]
combo = "en|zh-Hans"
id = "en-zh"
name = "English–Chinese Dictionary (英汉词典)"
description = "English dictionary with Simplified Chinese translations"

[[packs]]
combo = "en|es-ES"
id = "en-es"
name = "English–Spanish Dictionary (Diccionario inglés-español)"
description = "English dictionary with Spanish translations"

