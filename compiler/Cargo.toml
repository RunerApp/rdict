[package]
name = "rdict-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"

[dependencies]
rdict = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "rdict-compile"
path = "src/main.rs"

[[bin]]
name = "db_to_rdict"
path = "src/bin/db_to_rdict.rs"

[workspace]
